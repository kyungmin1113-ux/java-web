<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 회원가입 완료</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/search.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="/image/Logo.jpg" alt="logo" width="30" height="24">
            </a>

            <button class="btn border-0 text-white" id="themeToggleBtn" onclick="toggleTheme()">
                DARK
            </button>

            <div class="collapse navbar-collapse show">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">메인화면</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/main_page_sub/champion.html">챔피언</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/main_page_sub/download.html">다운로드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login">로그인</a>
                    </li>
                </ul>

                <form class="d-flex" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="Search" id="searchInput">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 480px;">
            <h2 class="fw-bold mb-3">회원가입 완료</h2>
            <p class="lead mb-4">가입이 완료되었습니다. 로그인 후 프로필을 확인해보세요.</p>
            <a href="/login" class="btn btn-primary w-100">로그인하러 가기</a>
        </div>
    </section>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">메시지</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/toggle.js"></script>
    <script src="/js/test.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            showToast('회원가입이 완료되었습니다!');
        });
    </script>
</body>
</html>
